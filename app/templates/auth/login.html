{% extends 'base.html' %}
{% block title %}Entrar · Portal JM{% endblock %}
{% block content %}
<section class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-mark" aria-hidden="true">⚗</div>
      <span class="eyebrow">PORTAL JM</span>
      <h1>Entrar</h1>
      <p>Acesse seu espaço de aprendizagem em Química.</p>
    </div>
    <form method="post" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="field"><span>E-mail</span><input name="email" type="email" placeholder="seu@email.com" required autocomplete="email"></label>
      <label class="field"><span>Senha</span><input name="password" type="password" placeholder="Digite sua senha" required autocomplete="current-password"></label>
      <button class="btn" type="submit">Entrar</button>
    </form>
    <a class="btn secondary google" href="{{ url_for('auth.google_login') }}">Continuar com Google</a>
    <p class="auth-switch">Ainda não tem conta? <a href="{{ url_for('auth.register') }}">Criar uma conta</a></p>
  </div>
</section>
{% endblock %}
