{% extends 'base.html' %}
{% block title %}Editar matéria · Portal JM{% endblock %}
{% block content %}
<section class="admin-shell"><div class="auth-card" style="margin:20px auto"><a class="back-link" href="{{ url_for('admin.subjects_list') }}">← Matérias</a><span class="eyebrow">ORGANIZAÇÃO</span><h1>Editar matéria</h1><form class="auth-form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="field"><span>Nome</span><input name="name" value="{{ subject.name }}" required></label><label class="field"><span>Série</span><select name="series_id" required>{% for s in series %}<option value="{{ s.id }}" {% if s.id==subject.series_id %}selected{% endif %}>{{ s.name }}</option>{% endfor %}</select></label><button class="btn" type="submit">Salvar alterações</button></form></div></section>
{% endblock %}
