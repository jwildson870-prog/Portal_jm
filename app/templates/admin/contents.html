{% extends 'base.html' %}{% block content %}<div class="between"><h1>Conteúdos</h1><a class="btn" href="{{url_for('admin.content_new')}}">+ Adicionar</a></div><div class="list">{% for c in contents %}<div class="card row"><div><h2>{{c.title}}</h2><p>{{c.series.name}} · {{c.subject.name}} · {{c.kind}}</p></div><div><a href="{{url_for('admin.content_edit',id=c.id)}}">Editar</a><form class="inline" method="post" action="{{url_for('admin.content_delete',id=c.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="danger">Excluir</button></form></div></div>{% else %}<div class="card">Nenhum conteúdo.</div>{% endfor %}</div>{% endblock %}
