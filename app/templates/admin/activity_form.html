{% extends 'base.html' %}{% block title %}{{activity.title}} · Atividade{% endblock %}{% block content %}
<section class="admin-shell"><a class="back-link" href="{{url_for('admin.activities')}}">← Atividades</a><span class="eyebrow">EDITOR DE ATIVIDADE</span><h1>{{activity.title}}</h1>
<form method="post" class="publisher" onsubmit="return prepareQuestions()"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="publisher-card form-grid"><label>Título<input name="title" value="{{activity.title}}" required></label><label>Descrição<textarea name="description">{{activity.description or ''}}</textarea></label></div><div class="publisher-card"><div class="between"><div><h2>Questões</h2><p class="muted">Crie múltipla escolha e escolha a resposta correta.</p></div><button type="button" class="btn secondary" onclick="addQuestion()">+ Questão</button></div><div id="questions"></div><textarea id="questions_json" name="questions_json" hidden></textarea></div><button class="btn admin-primary" type="submit">💾 Salvar atividade</button></form></section>
<script>
const initial={{questions|tojson}}; const box=document.getElementById('questions');
function addQuestion(q={question:'',options:['','','',''],correct:''}){const n=box.children.length;const card=document.createElement('div');card.className='question-editor publisher-card';card.innerHTML=`<div class="between"><h3>Questão ${n+1}</h3><button type="button" class="btn danger" onclick="this.closest('.question-editor').remove();renumber()">Remover</button></div><label>Enunciado<input class="qtext" value="${esc(q.question||'')}" required></label><div class="options">${(q.options||['','','','']).map((o,i)=>`<label>Alternativa ${String.fromCharCode(65+i)}<input class="qopt" value="${esc(o)}" required></label>`).join('')}</div><label>Resposta correta<select class="qcorrect"><option value="">Selecione</option>${(q.options||['','','','']).map(o=>`<option ${o&&o===q.correct?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;box.appendChild(card);renumber()}
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function renumber(){[...box.children].forEach((c,i)=>c.querySelector('h3').textContent='Questão '+(i+1))}
function prepareQuestions(){const qs=[];for(const c of box.children){const opts=[...c.querySelectorAll('.qopt')].map(x=>x.value.trim());qs.push({question:c.querySelector('.qtext').value.trim(),options:opts,correct:c.querySelector('.qcorrect').value})}document.getElementById('questions_json').value=JSON.stringify(qs);return qs.length>0}
initial.forEach(addQuestion); if(!initial.length)addQuestion();
</script>{% endblock %}
