{% extends 'base.html' %}
{% block title %}Séries · Portal JM{% endblock %}
{% block content %}
<section class="admin-shell">
  <div class="page-head"><div><a class="back-link" href="{{ url_for('admin.dashboard') }}">← Painel do professor</a><span class="eyebrow">ORGANIZAÇÃO</span><h1>Séries</h1><p>Gerencie as turmas disponíveis no portal.</p></div></div>
  <form class="publisher-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="formgrid"><label class="field"><span>Nome da série</span><input name="name" placeholder="Ex.: 4º ano" required></label><div style="display:flex;align-items:flex-end"><button class="btn" type="submit">Criar série</button></div></div></form>
  <div class="list" style="margin-top:15px">{% for s in series %}<div class="card row-card"><div><span class="badge">🎓 Série</span><h2 style="margin:8px 0 3px">{{ s.name }}</h2><p>{{ s.subjects|length }} matéria(s)</p></div><div class="material-actions"><a class="btn secondary" href="{{ url_for('admin.series_edit', id=s.id) }}">Editar</a><a class="btn secondary" href="{{ url_for('admin.series_detail', id=s.id) }}">Ver</a><form method="post" action="{{ url_for('admin.series_delete', id=s.id) }}" onsubmit="return confirm('Excluir esta série e seus dados relacionados?');"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="danger" type="submit">Excluir</button></form></div></div>{% endfor %}</div>
</section>
{% endblock %}
