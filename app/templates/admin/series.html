<link rel="stylesheet" href="../../static/css/portal-jm-suap-theme.css">
{% extends 'base.html' %}
{% block content %}
<h1>
  Séries
</h1>
<form class="inlineform card" method="post">
  <input type="hidden" name="csrf_token" value="{{csrf_token()}}">
  <input name="name" placeholder="Ex.: 4ª Série" required>
  <button class="btn">
    Criar série
  </button>
</form>
<div class="list">
  {% for s in series %}
  <div class="card row">
    <h2>
      {{s.name}}
    </h2>
    <div>
      <a href="{{url_for('admin.series_edit',id=s.id)}}">
        Editar
      </a>
      <form class="inline" method="post" action="{{url_for('admin.series_delete',id=s.id)}}">
        <input type="hidden" name="csrf_token" value="{{csrf_token()}}">
        <button class="danger">
          Excluir
        </button>
      </form>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
