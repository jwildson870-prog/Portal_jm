{% extends 'base.html' %}{% block content %}<div class="card wide"><h1>{{'Editar' if content else 'Adicionar'}} conteúdo</h1><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="formgrid"><label>Título<input name="title" value="{{content.title if content else ''}}" required></label><label>Descrição<input name="description" value="{{content.description if content else ''}}"></label><label>Série<select name="series_id" required>{% for s in series %}<option value="{{s.id}}" {% if content and content.series_id==s.id %}selected{% endif %}>{{s.name}}</option>{% endfor %}</select></label><label>Matéria<select name="subject_id" required>{% for s in subjects %}<option value="{{s.id}}" {% if content and content.subject_id==s.id %}selected{% endif %}>{{s.series.name}} · {{s.name}}</option>{% endfor %}</select></label><label>Tipo<select name="kind" required><option value="explanation" {% if not content or content.kind=='explanation' %}selected{% endif %}>Explicação</option><option value="pdf" {% if content and content.kind=='pdf' %}selected{% endif %}>PDF</option><option value="slide" {% if content and content.kind=='slide' %}selected{% endif %}>Slides</option><option value="video" {% if content and content.kind=='video' %}selected{% endif %}>Vídeo-aula</option></select></label><label>URL de slides/vídeo<input name="external_url" type="url" value="{{content.external_url if content else ''}}"></label><label>PDF<input name="pdf" type="file" accept="application/pdf,.pdf"></label></div><label>Texto da explicação<textarea name="body" rows="12">{{content.body if content else ''}}</textarea></label><button class="btn">Salvar conteúdo</button></form></div>{% endblock %}
