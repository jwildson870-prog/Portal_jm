{% extends 'base.html' %}
{% block content %}
<p><a href="{{url_for('student.dashboard')}}">← Voltar para séries</a></p>
<div class="section-title"><div><div class="eyebrow">Trilha de estudos</div><h1>{{series.name}}</h1><p class="muted">Selecione uma matéria para continuar.</p></div></div>
<div class="grid">{% for s in series.subjects %}<a class="card tile" href="{{url_for('student.subject',id=s.id)}}"><span class="tile-icon">🧪</span><h2>{{s.name}}</h2><p>{{s.contents|length}} conteúdo(s)</p></a>{% else %}<div class="card">Nenhuma matéria cadastrada.</div>{% endfor %}</div>
{% endblock %}
