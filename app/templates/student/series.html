{% extends 'base.html' %}{% block content %}<section class="student-shell"><p><a class="back-link" href="{{url_for('student.dashboard')}}">← Séries</a></p><span class="eyebrow">ÁREA DO ALUNO · SÉRIE</span><h1>{{series.name}}</h1><p class="muted">Escolha uma matéria para acessar os materiais.</p><div class="grid">{% for s in series.subjects %}<a class="card tile" href="{{url_for('student.subject',id=s.id)}}"><h2>{{s.name}}</h2><p>{{s.contents|length}} conteúdo(s)</p></a>{% else %}<div class="card">Nenhuma matéria cadastrada.</div>{% endfor %}</div></section>{% endblock %}
